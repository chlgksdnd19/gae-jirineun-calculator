name: Update shopping information

on:
  schedule:
    # 매일 06:17 Asia/Seoul (UTC 21:17)
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shopping-info-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feed repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test parsers
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Collect official shopping information
        run: python scripts/update_shopping_info.py

      - name: Commit changed feed
        run: |
          if git diff --quiet -- docs/shopping-info.json; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/shopping-info.json
          git commit -m "chore: update shopping information"
          git push
